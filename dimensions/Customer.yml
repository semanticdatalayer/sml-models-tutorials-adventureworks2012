unique_name: Customer
object_type: dimension
label: Customer
description: "Internet customer dimension: geography rollup down to the individual customer, demographics (income, education, occupation), and contact details. Individual consumers; contrast Reseller (wholesale)."
type: standard

hierarchies:

  - unique_name: Customer Geography
    label: Customer Geography
    description: "Customer location rollup Country > State-Province > City > Postal Code > Customer. Customer addresses; contrast Geography (reseller locations)."
    folder: Location  
    levels:

      - unique_name: Customer Country

      - unique_name: Customer State-Province

      - unique_name: Customer City

      - unique_name: Customer Postal Code

      - unique_name: Customer

        secondary_attributes:

          - unique_name: Address
            label: Address
            description: "Customer street address (address line 1). Customer contact detail, not reseller."
            folder: Location
            dataset: Customer Dataset
            name_column: addressline1
            key_columns:
              - addressline1
            sort_column: addressline1

          - unique_name: Birth Date
            label: Birth Date
            description: "Customer date of birth, for age-based demographics."
            folder: Customer Data
            dataset: Customer Dataset
            name_column: birthdate
            key_columns:
              - birthdate
            sort_column: birthdate

          - unique_name: Customer City Name
            label: Customer City Name
            description: Customer City attribute
            folder: Location
            dataset: Geography Dataset
            name_column: city
            key_columns:
              - city
              - stateprovincecode
            sort_column: city

          - unique_name: Commute Distance
            label: Commute Distance
            description: "Customer commute distance bracket (e.g. 0-1 Miles, 10+ Miles). Demographic attribute."
            folder: Demographic
            dataset: Customer Dataset
            name_column: commutedistance
            key_columns:
              - commutedistance
            sort_column: commutedistancesort

          - unique_name: Customer Country Name
            label: Customer Country Name
            description: Customer Country Name
            folder: Location
            dataset: Geography Dataset
            name_column: englishcountryregionname
            key_columns:
              - englishcountryregionname
            sort_column: englishcountryregionname

          - unique_name: Customer Full Name
            label: Customer Full Name
            folder: Customer Data
            description: Customer Full Name distinguished by customer key
            dataset: Customer Dataset
            name_column: fullname
            key_columns:
              - customerkey
            sort_column: fullname

          - unique_name: Education
            label: Education
            description: "Customer education level (e.g. Bachelors, High School). Demographic attribute."
            folder: Demographic
            dataset: Customer Dataset
            name_column: englisheducation
            key_columns:
              - englisheducation
            sort_column: englisheducation

          - unique_name: Email Address
            label: Customer Email Address
            description: "Customer email address. Customer contact, not reseller."
            folder: Customer Data
            dataset: Customer Dataset
            name_column: emailaddress
            key_columns:
              - emailaddress
            sort_column: emailaddress

          - unique_name: Gender
            label: Gender
            description: "Customer gender / sex (M, F). Demographic attribute."
            folder: Demographic
            dataset: Customer Dataset
            name_column: gender
            key_columns:
              - gender
            sort_column: gender

          - unique_name: Home Owner
            label: Home Owner
            description: "Whether the customer owns a home (homeowner Yes/No). Demographic attribute."
            folder: Demographic
            dataset: Customer Dataset
            name_column: houseownerdesc
            key_columns:
              - houseownerflag
            sort_column: houseownerdesc

          - unique_name: Marital Status
            label: Marital Status
            description: "Customer marital status (Married, Single). Demographic attribute."
            folder: Demographic
            dataset: Customer Dataset
            name_column: maritalstatusdesc
            key_columns:
              - maritalstatus
            sort_column: maritalstatusdesc

          - unique_name: Number of Cars Owned
            label: Number of Cars Owned
            description: "Number of cars the customer owns (0-4). Demographic attribute."
            folder: Demographic
            dataset: Customer Dataset
            name_column: numbercarsowned
            key_columns:
              - numbercarsowned
            sort_column: numbercarsowned

          - unique_name: Number of Children At Home
            label: Number of Children At Home
            description: "Number of children living at the customer home. Demographic; contrast Total Children."
            folder: Demographic
            dataset: Customer Dataset
            name_column: numberchildrenathome
            key_columns:
              - numberchildrenathome
            sort_column: numberchildrenathome

          - unique_name: Occupation
            label: Occupation
            description: "Customer occupation / profession (e.g. Professional, Skilled Manual, Management). Demographic attribute."
            folder: Demographic
            dataset: Customer Dataset
            name_column: englishoccupation
            key_columns:
              - englishoccupation
            sort_column: englishoccupation

          - unique_name: Phone
            label: Customer Phone
            description: "Customer phone number. Customer contact, not reseller."
            folder: Customer Data
            dataset: Customer Dataset
            name_column: phone
            key_columns:
              - phone
            sort_column: phone

          - unique_name: Customer Postal Code Name
            label: Customer Postal Code Name
            description: Customer's Postal Code
            folder: Location
            dataset: Geography Dataset
            name_column: postalcode
            key_columns:
              - postalcode
              - city
              - stateprovincecode
            sort_column: postalcode

          - unique_name: State-Province2
            label: State-Province2
            description: "Customer state / province code (e.g. CA, WA). Alternate state attribute on the customer leaf level."
            folder: Location
            dataset: Geography Dataset
            name_column: stateprovincecode
            key_columns:
              - stateprovincecode
              - countryregioncode
            sort_column: stateprovincecode

          - unique_name: Total Children
            label: Total Children
            description: "Total number of children the customer has. Demographic; contrast Number of Children At Home."
            folder: Demographic
            dataset: Customer Dataset
            name_column: totalchildren
            key_columns:
              - totalchildren
            sort_column: totalchildren

          - unique_name: Yearly Income
            label: Yearly Income
            description: "Customer annual / yearly income in dollars. Demographic attribute."
            folder: Demographic
            dataset: Customer Dataset
            name_column: yearlyincome
            key_columns:
              - yearlyincome
            sort_column: yearlyincome

level_attributes:

  - unique_name: Customer City
    label: Customer City
    description: "City where the customer lives (e.g. Seattle). Within Customer Geography; contrast City in the reseller Geography dimension."
    dataset: Geography Dataset
    name_column: city
    key_columns:
      - city
      - stateprovincecode

  - unique_name: Customer Country
    label: Customer Country
    description: "Country / nation where the customer lives (e.g. United States, Canada). Top of Customer Geography; contrast reseller Country."
    dataset: Geography Dataset
    name_column: englishcountryregionname
    key_columns:
      - englishcountryregionname

  - unique_name: Customer Postal Code
    label: Customer Postal Code
    description: "Customer zip / postal code. Within Customer Geography; contrast reseller Postal Code."
    dataset: Geography Dataset
    name_column: postalcode
    key_columns:
      - geographykey

  - unique_name: Customer State-Province
    label: Customer State-Province
    description: "State / province code where the customer lives (e.g. CA, WA). Within Customer Geography; contrast reseller State-Province."
    dataset: Geography Dataset
    name_column: stateprovincecode
    key_columns:
      - stateprovincecode
      - countryregioncode

  - unique_name: Customer
    label: Customer
    description: "Individual customer keyed by customer key (member name shows the key). Leaf of Customer Geography; see Customer Full Name for readable names."
    dataset: Customer Dataset
    name_column: customerkey
    key_columns:
      - customerkey

relationships:

  - from:
      dataset: Customer Dataset
      join_columns:
        - geographykey
    to:
      level: Customer Postal Code
    type: snowflake

modeler_metadata:
  version: 0
  modified: "false"
