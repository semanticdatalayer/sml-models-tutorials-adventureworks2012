            description: 'Date secondary attribute '
            associated_hierarchy: StandardMonth
            dataset: DateCustom
            key_columns:
              - datekey
            name_column: datekey
            sort_column: datekey
          - unique_name: Day Of Month
            label: Day Of Month
            description: "Day number within the month (1-31), Gregorian calendar. Role-played as Ship / Due dates; default is order date."
