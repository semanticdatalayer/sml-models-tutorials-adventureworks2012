unique_name: Date Custom
object_type: dimension
label: Date Custom
description: "Date dimension with Gregorian (StandardMonth, StandardWeek), Retail 4-4-5 (Retail445), and ISO 8601 week calendars. Role-played as Ship and Due dates; default join is order date."
hierarchies:
  - unique_name: StandardMonth
    label: StandardMonth
    description: "Standard Gregorian calendar rollup Year > Half Year > Quarter > Month > Date. Role-played as Ship / Due dates; default is order date. Contrast StandardWeek, Retail445, and ISO8601Week."
    folder: Dates
    levels:
      - unique_name: Year
      - unique_name: Half Year
      - unique_name: Quarter
        secondary_attributes:
          - unique_name: Half Year Of Year
            label: Half Year Of Year
            description: "Half year number within the year (1-2), Gregorian calendar. Role-played as Ship / Due dates; default is order date."
            folder: Dates
            dataset: DateCustom
            key_columns:
              - half_year_of_year
            name_column: half_year_of_year_name
            sort_column: half_year_of_year
      - unique_name: Month
        secondary_attributes:
          - unique_name: Quarter Of Half Year
            label: Quarter Of Half Year
            description: "Quarter number within the half year (1-2), Gregorian calendar. Role-played as Ship / Due dates; default is order date."
            folder: Dates
            dataset: DateCustom
            key_columns:
              - quarter_of_half_year
            name_column: quarter_of_half_year_name
            sort_column: quarter_of_half_year
          - unique_name: Quarter Of Year
            label: Quarter Of Year
            description: "Quarter number within the year (1-4), Gregorian calendar. Role-played as Ship / Due dates; default is order date. Not the Retail445 Reporting Quarter Of Year."
            folder: Dates
            dataset: DateCustom
            key_columns:
              - quarter_of_year
            name_column: quarter_of_year_name
            sort_column: quarter_of_year
      - unique_name: Date
