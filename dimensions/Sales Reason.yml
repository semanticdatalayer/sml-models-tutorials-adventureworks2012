unique_name: Sales Reason
object_type: dimension
label: Sales Reason
description: "Reasons customers gave for purchasing (e.g. Price, On Promotion, Review) grouped by reason type. Reached via the hidden Internet Sales Reason bridge."
type: standard

hierarchies:

  - unique_name: Sales Reasons
    label: Sales Reasons
    description: "Purchase reason rollup Sales Reason Type > Sales Reason (e.g. Marketing > Television Advertisement)."
    folder: Sales Reasons
    levels:

      - unique_name: Sales Reason Reason Type

      - unique_name: Sales Reason

level_attributes:

  - unique_name: Sales Reason
    label: Sales Reason
    description: "Specific reason a customer gave for the purchase (e.g. Price, On Promotion, Review). Leaf under Sales Reason Type."
    dataset: Sales Reason Dataset
    name_column: salesreasonname
    key_columns:
      - salesreasonkey

  - unique_name: Sales Reason Reason Type
    label: Sales Reason Type
    description: "Category / type of purchase reason (e.g. Marketing, Promotion, Other). Parent of Sales Reason."
    dataset: Sales Reason Dataset
    name_column: salesreasonreasontype
    key_columns:
      - salesreasonreasontype

