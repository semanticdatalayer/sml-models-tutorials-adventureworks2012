unique_name: Product
object_type: dimension
label: Product
description: "Product master dimension: category / subcategory rollup, model lines, stock levels, pricing, and physical attributes (color, size, weight). Sold in both internet and reseller channels."
type: standard

hierarchies:

  - unique_name: Product Categories
    label: Product Categories
    description: "Product rollup Category > Subcategory > Product (e.g. Bikes > Mountain Bikes). Contrast Product Model Lines and Stock Level."
    folder: Product Data
    levels:

      - unique_name: Category

      - unique_name: Subcategory

      - unique_name: Product

        secondary_attributes:

          - unique_name: Category Name
            label: Category Name
            description: "Product category name (e.g. Bikes, Clothing). Descriptive attribute mirroring the Category level."
            folder: Product Data
            associated_hierarchy: Product Categories
            dataset: Product Category
            name_column: englishproductcategoryname
            key_columns:
              - productcategorykey
            sort_column: englishproductcategoryname

          - unique_name: Class
            label: Class
            description: "Product class (High, Medium, Low; Not Applicable for components). Stocking attribute."
            folder: Stocking
            custom_empty_member:
              key:
                - NA
              name: Not Applicable
              sort_name: Not Applicable
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: classdesc
            key_columns:
              - classNoNull
            sort_column: classdesc

          - unique_name: Color
            label: Color
            description: "Product color / colour (e.g. Black, Red, Silver). Stocking attribute."
            folder: Stocking
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: color
            key_columns:
              - color
            sort_column: color

          - unique_name: Days to Manufacture
            label: Days to Manufacture
            description: "Number of days required to manufacture the product. Stocking attribute."
            folder: Stocking
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: daystomanufacture
            key_columns:
              - daystomanufacture
            sort_column: daystomanufacture

          - unique_name: Dealer Price
            label: Dealer Price
            description: "Dealer / wholesale price of the product in dollars. Contrast List Price (retail) and Standard Cost."
            folder: Financial
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: dealerprice
            key_columns:
              - dealerprice
            sort_column: dealerprice

          - unique_name: End Date
            label: End Date
            description: "Date the product was discontinued; shows Active while still sold. History attribute; contrast Start Date."
            folder: History
            custom_empty_member:
              key:
                - 1970-01-01 00:00:00
              name: Active
              sort_name: 1970-01-01 00:00:00
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: simpleenddate
            key_columns:
              - enddateNoNull
            sort_column: enddateNoNull

          - unique_name: Large Photo
            label: Large Photo
            description: "Reference to the product large photo, keyed by product. Technical attribute."
            folder: Stocking
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: productkey
            key_columns:
              - productkey
            sort_column: productkey

          - unique_name: List Price
            label: List Price
            description: "Suggested retail list price / MSRP of the product in dollars. Contrast Dealer Price and Standard Cost."
            folder: Financial
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: listPriceNoNull
            key_columns:
              - listPriceNoNull
            sort_column: listPriceNoNull

          - unique_name: Model Name
            label: Model Name
            description: "Product model name (e.g. Road-150); assembly components grouped under a default member. Contrast Product Name (individual item)."
            folder: Product Data
            custom_empty_member:
              key:
                - Assembly Components
              name: Assembly Components
              sort_name: Assembly Components
            associated_hierarchy: Product Model Lines
            dataset: Product Dataset
            name_column: modelnameassembly
            key_columns:
              - modelnameassembly
            sort_column: modelnameassembly

          - unique_name: Product Line Name
            label: Product Line Name
            description: "Product line name (e.g. Road, Mountain, Touring). Descriptive attribute mirroring the Product Line level."
            folder: Product Data
            associated_hierarchy: Product Model Lines
            dataset: Product Dataset
            name_column: productlinename
            key_columns:
              - productline
            sort_column: productlinename

          - unique_name: Product Name
            label: Product Name
            description: "Product name in English (e.g. Mountain-200 Black, 38). Descriptive attribute mirroring the Product level."
            folder: Product Data
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: englishproductname
            key_columns:
              - productkey
            sort_column: englishproductname

          - unique_name: Reorder Point
            label: Reorder Point
            description: "Inventory reorder point threshold for the product. Stocking attribute; contrast Safety Stock Level."
            folder: Stocking
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: reorderpoint
            key_columns:
              - reorderpoint
            sort_column: reorderpoint

          - unique_name: Safety Stock Level Name
            label: Safety Stock Level Name
            description: "Safety stock level value for the product. Mirrors the Safety Stock Level hierarchy level."
            folder: Stocking
            associated_hierarchy: Stock Level
            dataset: Product Dataset
            name_column: safetystocklevel
            key_columns:
              - safetystocklevel
            sort_column: safetystocklevel

          - unique_name: Size Range
            label: Size Range
            description: "Product size range bracket (e.g. 38-40 CM). Stocking attribute; contrast Size (exact value)."
            folder: Stocking
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: sizerange
            key_columns:
              - sizerange
            sort_column: sizerange

          - unique_name: Size
            label: Size
            description: "Product size (e.g. 38, 42, L). Stocking attribute; contrast Size Range (bracket)."
            folder: Stocking
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: size
            key_columns:
              - size
            sort_column: size

          - unique_name: Standard Cost
            label: Standard Cost
            description: "Standard manufacturing cost of the product in dollars. Contrast List Price and Dealer Price."
            folder: Financial
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: standardcost
            key_columns:
              - standardcost
            sort_column: standardcost

          - unique_name: Start Date
            label: Start Date
            description: "Date the product became available for sale. History attribute; contrast End Date."
            folder: History
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: simplestartdate
            key_columns:
              - startdate
            sort_column: startdate

          - unique_name: Status
            label: Status
            description: "Product status (Current or Historical). History attribute."
            folder: History
            custom_empty_member:
              key:
                - NA
              name: Historical
              sort_name: Historical
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: statusdesc
            key_columns:
              - statusNoNull
            sort_column: statusdesc

          - unique_name: Style
            label: Style
            description: "Product style (Womens, Mens, Universal; Not Applicable for components). Stocking attribute."
            folder: Stocking
            custom_empty_member:
              key:
                - NA
              name: Not Applicable
              sort_name: Not Applicable
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: styledesc
            key_columns:
              - styleNoNull
            sort_column: styledesc

          - unique_name: Subcategory Name
            label: Subcategory Name
            description: "Product subcategory name (e.g. Mountain Bikes, Helmets). Descriptive attribute mirroring the Subcategory level."
            folder: Product Data
            associated_hierarchy: Product Categories
            dataset: Product Subcategory
            name_column: englishproductsubcategoryname
            key_columns:
              - productsubcategorykey
            sort_column: englishproductsubcategoryname

          - unique_name: Weight
            label: Weight
            description: "Product weight (0 when not applicable). Stocking attribute."
            folder: Stocking
            custom_empty_member:
              key:
                - 0
              name: '0'
              sort_name: '0'
            associated_hierarchy: Product Categories
            dataset: Product Dataset
            name_column: weightNoNull
            key_columns:
              - weightNoNull
            sort_column: weightNoNull

  - unique_name: Product Model Lines
    label: Product Model Lines
    description: "Product rollup Product Line > Model > Product (e.g. Road > Road-150). Contrast Product Categories and Stock Level."
    folder: Product Data
    filter_empty: "yes"

    levels:

      - unique_name: Product Line

      - unique_name: Model

      - unique_name: Product

  - unique_name: Stock Level
    label: Stock Level
    description: "Product rollup Safety Stock Level > Product, for stocking / inventory analysis. Contrast Product Categories."
    folder: Stocking
    filter_empty: "yes"

    levels:

      - unique_name: Safety Stock Level

      - unique_name: Product

level_attributes:

  - unique_name: Category
    label: Category
    description: "Product category (Bikes, Components, Clothing, Accessories). Top of the Product Categories hierarchy."
    dataset: Product Category
    name_column: englishproductcategoryname
    key_columns:
      - productcategorykey

  - unique_name: Model
    label: Model
    description: "Product model name (e.g. Road-150); assembly components grouped under a default member. Between Product Line and Product."
    custom_empty_member:
      key:
        - Assembly Components
      name: Assembly Components
    dataset: Product Dataset
    name_column: modelnameassembly
    key_columns:
      - modelnameassembly

  - unique_name: Product
    label: 'Product '
    description: "Individual product by English name (e.g. Mountain-200 Black, 38). Leaf of all product hierarchies."
    dataset: Product Dataset
    name_column: englishproductname
    key_columns:
      - productkey

  - unique_name: Product Line
    label: Product Line
    description: "Product line (e.g. Road, Mountain, Touring). Top of the Product Model Lines hierarchy."
    dataset: Product Dataset
    name_column: productlinename
    key_columns:
      - productline

  - unique_name: Safety Stock Level
    label: Safety Stock Level
    description: "Safety stock level threshold for inventory. Top of the Stock Level hierarchy."
    dataset: Product Dataset
    name_column: safetystocklevel
    key_columns:
      - safetystocklevel

  - unique_name: Subcategory
    label: Subcategory
    description: "Product subcategory (e.g. Mountain Bikes, Helmets). Between Category and Product."
    dataset: Product Subcategory
    name_column: englishproductsubcategoryname
    key_columns:
      - productsubcategorykey

relationships:

  - from:
      dataset: Product Dataset
      join_columns:
        - productsubcategorykey
    to:
      level: Subcategory
    type: snowflake

  - from:
      dataset: Product Subcategory
      join_columns:
        - productcategorykey
    to:
      level: Category
    type: snowflake

modeler_metadata:
  version: 0
  modified: "false"
